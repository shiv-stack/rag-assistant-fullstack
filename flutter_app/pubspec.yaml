name: rag_knowledge_assistant
description: RAG Knowledge Assistant - Flutter Frontend
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Networking
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1

  # File picking
  file_picker: ^8.0.3

  # Dependency injection
  get_it: ^7.6.7

  # Functional programming (Either type for error handling)
  dartz: ^0.10.1

  # UI
  flutter_markdown: ^0.6.22
  shimmer: ^3.0.0
  fluttertoast: ^8.2.5

  # Utils
  uuid: ^4.3.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  bloc_test: ^9.1.5
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        # - asset: assets/fonts/Inter-Regular.ttf
        # - asset: assets/fonts/Inter-Medium.ttf
        #   weight: 500
        # - asset: assets/fonts/Inter-SemiBold.ttf
        #   weight: 600
        # - asset: assets/fonts/Inter-Bold.ttf
        #   weight: 700